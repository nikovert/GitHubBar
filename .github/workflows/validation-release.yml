name: Validation prerelease

on:
  push:
    tags:
      - "validation-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "New validation tag (for example validation-v0.1.0-1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install check tools
        run: brew install xcodegen ripgrep

      - name: Check core and app sources
        run: scripts/check.sh

      - name: Test core package
        run: swift test --package-path Packages/GitHubBarCore --parallel

      - name: Build and test macOS app
        run: >-
          xcodebuild test -project GitHubBar.xcodeproj
          -scheme GitHubBar -configuration Debug
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      - name: Resolve validation version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^validation-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "Tag must match validation-vMAJOR.MINOR.PATCH-N" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#validation-v}" | sed 's/-[0-9]*$//' >> "$GITHUB_OUTPUT"

      - name: Build universal validation artifact
        env:
          GITHUBBAR_VERSION: ${{ steps.release.outputs.version }}
        run: scripts/package-validation.sh

      - name: Verify fork download
        shell: bash
        run: |
          set -euo pipefail
          app=".build/validation/GitHubBar.app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "com.nikovert.githubbar"
          lipo "$app/Contents/MacOS/GitHubBar" -verify_arch arm64
          lipo "$app/Contents/MacOS/GitHubBar" -verify_arch x86_64
          codesign --verify --deep --strict "$app"
          cd dist
          shasum -a 256 -c GitHubBar-validation-*.zip.sha256
          unzip -t GitHubBar-validation-*.zip >/dev/null

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/GitHubBar-validation-*.zip \
            dist/GitHubBar-validation-*.zip.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "GitHubBar $TAG" \
            --notes-file docs/releases/validation-release.md
